<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BÜRK · Seguimiento Pickle Pro Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f141c;--panel:#181f29;--panel2:#202936;--line:#2b3645;--text:#f4f6f2;--muted:#93a0b2;--accent:#d7f24c;--cyan:#43d3d0;--win:#65dd8c;--loss:#ff7d7d;--gold:#ffd66b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}header{padding:28px 20px;border-bottom:1px solid var(--line);background:#151b25}header>div,main{max-width:1180px;margin:auto}.brand{margin:0 0 5px;color:var(--accent);font:700 14px 'Space Grotesk';letter-spacing:.14em;text-transform:uppercase}h1{margin:0 0 8px;font:700 clamp(25px,5vw,36px) 'Space Grotesk'}.meta{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 14px}.toolbar input{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 13px}.toolbar button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer}.players{display:grid;gap:12px}.player{border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden}.player[open]{border-color:#4a5b2b}.player summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:16px;align-items:center}.player summary::-webkit-details-marker{display:none}.name{font:700 17px 'Space Grotesk'}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:12px;color:var(--muted);background:var(--panel2);padding:5px 8px;border-radius:20px}.achievement{font:700 12px 'Space Grotesk';color:#1b1600;background:var(--gold);padding:6px 10px;border-radius:20px;white-space:nowrap}.body{border-top:1px solid var(--line);padding:0 18px 18px}.category{margin-top:18px}.category-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.category h3{margin:0;font:700 14px 'Space Grotesk';color:var(--accent)}.category-achievement{color:var(--gold);font-size:12px;font-weight:700}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#141a23}tr:last-child td{border-bottom:0}.phase{color:var(--muted)}.result{font:700 13px 'Space Grotesk'}.result.win{color:var(--win)}.result.loss{color:var(--loss)}.pill{display:inline-block;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:700}.pill.next{background:var(--accent);color:#172000}.pill.win{background:rgba(101,221,140,.15);color:var(--win)}.pill.loss{background:rgba(255,125,125,.14);color:var(--loss)}a{color:var(--cyan);text-decoration:none}.empty,.error{text-align:center;color:var(--muted);padding:55px 20px}@media(max-width:760px){.player summary{grid-template-columns:1fr}.achievement{justify-self:start}.body{padding:0 10px 14px}main{padding:0 12px 45px}}
</style></head>
<body><header><div><p class="brand">BÜRK · Jugadores patrocinados</p><h1 id="title">Cargando…</h1><div class="meta" id="updated">—</div></div></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Buscar jugador o categoría…"><button id="expand">Abrir todos</button><button id="collapse">Cerrar todos</button></div><div id="content" class="players"><div class="empty">Cargando resultados…</div></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
function splitCourt(t=''){const p=t.split(' / Pista:');return{time:p[0]||'',court:p[1]||''}}
function phaseLabel(p){return({grupos:'Grupos',dieciseisavos:'Dieciseisavos',octavos:'Octavos',cuartos:'Cuartos',semifinal:'Semifinal',final:'Final'})[p]||'Partido'}
function groupByCategory(matches){return matches.reduce((a,m)=>((a[m.categoria||'Categoría']??=[]).push(m),a),{})}
function row(m){const d=splitCourt(m.horario_pista);let state='<span class="pill next">Próximo</span>',cls='';if(m.jugado){if(m.ganado===true){state='<span class="pill win">Victoria</span>';cls='win'}else if(m.ganado===false){state='<span class="pill loss">Derrota</span>';cls='loss'}else state='<span class="pill">Jugado</span>'}return `<tr><td class="phase">${esc(phaseLabel(m.fase))}</td><td>${esc(m.rival||'—')}</td><td>${esc(d.time)}${d.court?' · Pista '+esc(d.court):''}</td><td class="result ${cls}">${m.jugado?esc(m.resultado):'—'}</td><td>${state}</td><td>${m.url_grupo?`<a href="${esc(m.url_grupo)}" target="_blank" rel="noopener">Ver cuadro →</a>`:''}</td></tr>`}
function playerCard(name,data){const s=data.resumen||{};const achievements=data.logros||[];const top=achievements[0];const cats=groupByCategory(data.partidos||[]);const sections=Object.entries(cats).map(([cat,matches])=>{const ach=achievements.find(a=>a.categoria===cat);return `<section class="category"><div class="category-head"><h3>${esc(cat)}</h3>${ach?`<span class="category-achievement">🏆 ${esc(ach.titulo)}</span>`:''}</div><div class="table-wrap"><table><thead><tr><th>Fase</th><th>Rival</th><th>Fecha y pista</th><th>Resultado</th><th>Estado</th><th></th></tr></thead><tbody>${matches.map(row).join('')}</tbody></table></div></section>`}).join('');return `<details class="player" data-search="${esc((name+' '+Object.keys(cats).join(' ')).toLowerCase())}"><summary><span class="name">${esc(name)}</span><span class="stats"><span class="stat">${s.jugados||0} jugados</span><span class="stat">${s.victorias||0} victorias</span><span class="stat">${s.derrotas||0} derrotas</span>${s.proximos?`<span class="stat">${s.proximos} próximos</span>`:''}</span>${top?`<span class="achievement">🏆 ${esc(top.titulo)}</span>`:''}</summary><div class="body">${sections||'<p class="empty">Sin partidos encontrados.</p>'}</div></details>`}
function render(data){document.getElementById('title').textContent=data.torneo_nombre||'Torneo';document.getElementById('updated').textContent=data.actualizado?'Última actualización: '+new Date(data.actualizado).toLocaleString('es-ES'):'Sin actualizar';const entries=Object.entries(data.jugadores||{});document.getElementById('content').innerHTML=entries.length?entries.map(([n,d])=>playerCard(n,d)).join(''):'<div class="empty">No hay jugadores.</div>'}
async function load(){try{const r=await fetch('./resultados.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();render(await r.json())}catch(e){document.getElementById('content').innerHTML='<div class="error">No se pudieron cargar los resultados.</div>'}}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.player').forEach(x=>x.hidden=!x.dataset.search.includes(q))});document.getElementById('expand').onclick=()=>document.querySelectorAll('.player:not([hidden])').forEach(x=>x.open=true);document.getElementById('collapse').onclick=()=>document.querySelectorAll('.player').forEach(x=>x.open=false);load();setInterval(load,60000);
</script></body></html>
