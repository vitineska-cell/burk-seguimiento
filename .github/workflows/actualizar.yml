name: Actualizar resultados BÜRK

on:
  workflow_dispatch:

concurrency:
  group: actualizar-burk-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Ejecutar pruebas del parser
        run: python tests/test_parser.py

      - name: Ejecutar el scraper
        run: python scraper.py

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraper
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar los resultados actualizados
        run: |
          git config user.name "BÜRK Bot"
          git config user.email "actions@github.com"
          git add docs/resultados.json

          if git diff --staged --quiet; then
            echo "No hay cambios en resultados.json"
            exit 0
          fi

          git commit -m "Actualizar resultados $(date -u +'%Y-%m-%d %H:%M UTC')"

          for intento in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push rechazado; reintento $intento/3..."
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 3))
          done

          echo "No se pudo publicar resultados.json tras 3 intentos"
          exit 1
