name: Actualizar resultados BÜRK

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
    inputs:
      torneo_id:
        description: "ID del torneo (vacío = usar jugadores.json)"
        required: false
        type: string
      torneo_nombre:
        description: "Nombre del torneo (vacío = usar jugadores.json)"
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - "scraper.py"
      - "scraper_runner.py"
      - "scraper_final.py"
      - "fases.py"
      - "matching.py"
      - "diagnostico_parser.py"
      - "jugadores.json"
      - "ventana.py"
      - "docs/index.html"
      - "tests/**"
      - ".github/workflows/actualizar.yml"
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - "scraper_runner.py"
      - "scraper_final.py"
      - "fases.py"
      - "matching.py"
      - "diagnostico_parser.py"
      - "jugadores.json"
      - "ventana.py"
      - "docs/index.html"
      - "tests/**"
      - ".github/workflows/actualizar.yml"

concurrency:
  group: actualizar-burk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      TORNEO_ID: ${{ inputs.torneo_id }}
      TORNEO_NOMBRE: ${{ inputs.torneo_nombre }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar ventana automática del torneo
        id: ventana
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ACTIVO=$(python3 ventana.py --github-output "$GITHUB_OUTPUT")
          if [ "$ACTIVO" != "true" ]; then
            echo "Fuera de la ventana del torneo: no se consulta Pickle Pro Tour."
          fi

      - name: Seleccionar el torneo programado
        if: github.event_name == 'schedule' && steps.ventana.outputs.activo == 'true'
        shell: bash
        run: |
          echo "TORNEO_ID=${{ steps.ventana.outputs.torneo_id }}" >> "$GITHUB_ENV"
          echo "TORNEO_NOMBRE=${{ steps.ventana.outputs.torneo_nombre }}" >> "$GITHUB_ENV"

      - name: Configurar Python
        if: steps.ventana.outputs.activo == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: steps.ventana.outputs.activo == 'true'
        run: |
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        if: steps.ventana.outputs.activo == 'true'
        run: |
          python -m py_compile scraper.py scraper_runner.py scraper_final.py matching.py fases.py ventana.py diagnostico_parser.py
          python -u tests/test_parser.py
          python -u tests/test_runner.py
          python -u tests/test_matching.py
          python -u tests/test_logros.py
          python -u tests/test_ventana.py
          python -u tests/test_config.py

      - name: Ejecutar el scraper
        if: steps.ventana.outputs.activo == 'true'
        shell: bash
        run: |
          mkdir -p debug
          set -o pipefail
          python -u scraper_final.py 2>&1 | tee debug/ejecucion.log

      - name: Diagnosticar nombres y tablas
        if: failure() && steps.ventana.outputs.activo == 'true'
        run: python -u diagnostico_parser.py

      - name: Guardar diagnóstico
        if: always() && steps.ventana.outputs.activo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-scraper
          path: |
            debug/
            docs/resultados.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar los resultados actualizados
        if: steps.ventana.outputs.activo == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "BÜRK Bot"
          git config user.email "actions@github.com"
          git add docs/resultados.json

          if git diff --staged --quiet; then
            echo "No hay cambios en resultados.json"
            exit 0
          fi

          git commit -m "Actualizar resultados $(date -u +'%Y-%m-%d %H:%M UTC')"

          for intento in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push rechazado; reintento $intento/3..."
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 3))
          done

          echo "No se pudo publicar resultados.json tras 3 intentos"
          exit 1
